<div class="flex flex-col gap-1">
  @if (label()) {
    <label [attr.for]="selectId" class="text-sm font-semibold text-portal-400">{{ label() }}</label>
  }

  @if (loading()) {
    <div
      class="h-10 animate-pulse rounded-lg bg-lab-700"
      role="status"
      aria-label="Cargando opciones"
    ></div>
  } @else {
    <select
      [id]="selectId"
      class="h-10 w-full rounded-lg border border-lab-700 bg-lab-800 px-3 text-slate-200 transition [color-scheme:dark] hover:border-portal-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-portal-400 disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="isBlocked()"
      (change)="onChange($event)"
    >
      <option value="" disabled [selected]="value() === null">{{ placeholder() }}</option>
      @for (option of options(); track option.value) {
        <option [value]="option.value" [selected]="option.value === value()">{{ option.label }}</option>
      }
    </select>
  }
</div>
