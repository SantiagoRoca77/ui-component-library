<main class="min-h-screen space-y-6 bg-lab-900 p-8">
  <h1 class="text-3xl font-bold text-portal-400">Prueba de componentes</h1>

  <div class="flex flex-wrap items-center gap-4">
    <ui-button label="Primary" variant="primary" (clicked)="onClick('primary')" />
    <ui-button label="Secondary" variant="secondary" (clicked)="onClick('secondary')" />
    <ui-button label="Danger" variant="danger" (clicked)="onClick('danger')" />
  </div>

  <div class="flex flex-wrap items-center gap-4">
    <ui-button label="Small" size="sm" (clicked)="onClick('sm')" />
    <ui-button label="Medium" size="md" (clicked)="onClick('md')" />
    <ui-button label="Large" size="lg" (clicked)="onClick('lg')" />
  </div>

  <div class="flex flex-wrap items-center gap-4">
    <ui-button label="Disabled" [disabled]="true" (clicked)="onClick('disabled')" />
    <ui-button label="Cargando" [loading]="true" (clicked)="onClick('loading')" />
  </div>

  <div class="grid gap-4 md:grid-cols-3">
    <ui-card title="Raised" subtitle="Con sombra" elevation="raised" (headerClicked)="onClick('card raised')">
      <p>Contenido proyectado con ng-content.</p>
    </ui-card>
    <ui-card title="Flat" elevation="flat" (headerClicked)="onClick('card flat')">
      <p>Sin sombra y sin subtítulo.</p>
    </ui-card>
    <ui-card title="Outlined" subtitle="Con borde" elevation="outlined" (headerClicked)="onClick('card outlined')">
      <ui-button label="Botón dentro de la card" size="sm" />
    </ui-card>
  </div>

  <div class="grid max-w-2xl gap-4 md:grid-cols-3">
  <ui-select
    label="Recurso"
    [options]="resourceOptions"
    [(value)]="resource"
    (selectionChange)="onClick('select: ' + $event.label)"
  />
  <ui-select label="Cargando" [loading]="true" [options]="resourceOptions" />
  <ui-select label="Deshabilitado" [disabled]="true" [options]="resourceOptions" />
</div>

<div class="flex items-center gap-4">
  <p class="text-slate-300">Valor: <span class="font-bold text-morty">{{ resource() ?? 'ninguno' }}</span></p>
  <ui-button label="Reiniciar" size="sm" variant="secondary" (clicked)="resource.set(null)" />
</div>


  <p class="text-slate-300">
    Último click: <span class="font-bold text-morty">{{ lastClick() }}</span>
  </p>
</main>
